name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Haglund DDS, which the C# library calls and this library falls back to: the binaries BEN
# ships (lorserker/ben), pinned to a commit and checked by SHA-256.
env:
  BEN_COMMIT: 5098782eaac4df07482a1178ce3f6000319fe95e
  POSITIONS: 300

jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Highway (for the non-AVX2 build)
        run: sudo apt-get update -q && sudo apt-get install -y -q libhwy-dev
      - name: Build (AVX2)
        run: ./build.sh
      - name: Unit tests, AVX2
        run: ./build.sh test
      - name: Unit tests, Highway
        run: OUT=bin/hwy ARCH="-march=x86-64-v3 -mno-avx2" ./build.sh test
      - name: Unit tests, scalar
        run: OUT=bin/scalar HWY=none ARCH="-march=x86-64-v3 -mno-avx2" ./build.sh test
      - name: Haglund DDS
        run: |
          mkdir -p dds
          curl -fsSL -o dds/libdds.so "https://raw.githubusercontent.com/lorserker/ben/$BEN_COMMIT/bin/BGA/linux/x64/libdds.so"
          echo "f849ce43164edab3e238e3dacfd65f7dab08fffde185c6726fb933975c8dc9f5  dds/libdds.so" | sha256sum -c -
      - name: Same results as the C# library
        run: BGA_DDS_LIB=$PWD/dds/libdds.so ./check.sh
      - name: C# results, for the macOS job
        uses: actions/upload-artifact@v4
        with:
          name: csharp-results
          path: bin/check-csharp.txt
      - name: Results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-linux
          path: bin/check-*.txt

  # The C# library is not run on macOS: on runners with fewer than 8 cores DDS rejects some of
  # the 8 thread indexes it uses (BGA 0.9.9.3), and it scores those solves as 0 tricks. This
  # library is checked against the C# results from the Linux job instead (same positions).
  macos:
    name: macos
    needs: linux
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Highway
        run: brew install highway
      - name: Build (Highway)
        run: ./build.sh
      - name: Unit tests, Highway
        run: ./build.sh test
      - name: Unit tests, scalar
        run: OUT=bin/scalar HWY=none ./build.sh test
      - name: Haglund DDS
        run: |
          mkdir -p dds
          curl -fsSL -o dds/libdds.dylib "https://raw.githubusercontent.com/lorserker/ben/$BEN_COMMIT/bin/BGA/macos/arm64/libdds.2.9.0.dylib"
          echo "ab05893e2e3810243bcdd134b159bb405564d979571b6b1b4c3084f82b3cbece  dds/libdds.dylib" | shasum -a 256 -c -
      - name: C# results from the Linux job
        uses: actions/download-artifact@v4
        with:
          name: csharp-results
          path: reference
      - name: Same results as the C# library
        run: BGA_DDS_LIB=$PWD/dds/libdds.dylib REFERENCE=reference/check-csharp.txt ./check.sh
      - name: Results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-macos
          path: bin/check-*.txt
